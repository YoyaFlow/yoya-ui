<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>yoya-ui — logical rows (vScroll)</title>
    <link rel="stylesheet" href="/dist/yoya.ui.css" />
    <style>
      body {
        color: #172033;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        margin: 0;
        padding: 16px;
      }

      .row {
        align-items: center;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        gap: 12px;
        padding: 6px 8px;
      }

      .row-id {
        color: #64748b;
        width: 64px;
      }
    </style>
  </head>
  <body>
    <div id="vscroll-host"></div>
    <script type="module" src="./vscroll.js"></script>
  </body>
</html>
