<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>yoya-ui (keyed) — core benchmark</title>
    <link rel="stylesheet" href="/dist/yoya.ui.css" />
    <style>
      body {
        color: #172033;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        margin: 0;
        padding: 16px;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }

      button {
        background: #2563eb;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        padding: 8px 12px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      td,
      th {
        border-bottom: 1px solid #e2e8f0;
        padding: 6px 8px;
        text-align: left;
      }

      tr.danger td {
        background: #fee2e2;
      }

      .remove {
        cursor: pointer;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <div class="buttons">
        <button type="button" id="run">Create 1,000 rows</button>
        <button type="button" id="replace">Replace all rows</button>
        <button type="button" id="runlots">Create 10,000 rows</button>
        <button type="button" id="add">Append 1,000 rows</button>
        <button type="button" id="update">Update every 10th row</button>
        <button type="button" id="clear">Clear</button>
        <button type="button" id="swaprows">Swap Rows</button>
      </div>
      <div id="table-host"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
