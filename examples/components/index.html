<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yoya-ui Components 复合组件演示</title>
    <style>
      body {
        margin: 0;
        color: #172033;
        background: #f5f7fa;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1rem;
      }

      p,
      span,
      output {
        color: #5a6575;
      }

      output {
        font-weight: 700;
      }

      .components-shell {
        min-height: 100vh;
        padding: 32px 0;
      }

      .components-container {
        display: grid;
        gap: 18px;
        width: min(100%, 1120px);
        margin: 0 auto;
        padding: 0 16px;
        box-sizing: border-box;
      }

      .components-examples {
        width: 100%;
      }

      .components-header {
        display: grid;
        gap: 8px;
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        padding: 20px;
        background: #ffffff;
      }

      .component-example {
        align-items: start;
        width: 100%;
      }

      .source-panel {
        display: grid;
        gap: 10px;
        width: 100%;
        min-width: 0;
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        padding: 16px;
        background: #ffffff;
      }

      .source-panel h2 {
        color: #172033;
      }

      .source-code {
        max-height: 360px;
        margin: 0;
        overflow: auto;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 14px;
        background: #fbfcfe;
      }

      .source-code code {
        display: block;
        min-width: max-content;
        color: #172033;
        font-family: "Cascadia Code", "Fira Code", ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.86rem;
        line-height: 1.55;
        white-space: pre;
      }

      .task-row,
      .locale-row,
      .feedback-row {
        align-items: center;
        min-height: 40px;
      }

      .task-log {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .task-log li {
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 10px 12px;
        background: #fbfcfe;
      }

      .metric {
        display: grid;
        gap: 4px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 14px;
        background: #fbfcfe;
      }

      .metric strong {
        color: #172033;
        font-size: 1.4rem;
      }

      .danger-zone {
        border-left: 4px solid #dc2626;
        padding: 10px 12px;
        background: #fef2f2;
      }

      .overlay-actions {
        align-items: stretch;
        flex-wrap: wrap;
        gap: 12px !important;
      }

      .context-demo-target {
        display: grid;
        gap: 4px;
        min-width: 220px;
        border: 1px dashed #94a3b8;
        border-radius: 6px;
        padding: 10px 12px;
        background: #fbfcfe;
        cursor: context-menu;
      }

      .context-demo-target strong {
        color: #172033;
      }

      .yoya-vbutton:hover {
        filter: brightness(0.98);
      }

      .yoya-vbutton:disabled {
        pointer-events: none;
      }

      .yoya-vmessage-container {
        width: min(360px, calc(100vw - 32px));
      }

      @media (max-width: 820px) {
        .components-shell {
          padding: 20px 0;
        }

        .components-container {
          padding-left: 16px !important;
          padding-right: 16px !important;
        }

        .component-example {
          grid-template-columns: 1fr !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./components-demo.js"></script>
  </body>
</html>
