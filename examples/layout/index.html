<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yoya-ui Layout 布局演示</title>
    <style>
      body {
        margin: 0;
        color: #172033;
        background: #f5f7fa;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .layout-shell {
        min-height: 100vh;
        padding: 32px 0;
      }

      .layout-flow {
        width: 100%;
      }

      .layout-header,
      .layout-panel,
      .metric-card {
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        background: #ffffff;
      }

      .layout-header,
      .layout-panel {
        padding: 20px;
      }

      .layout-header {
        display: grid;
        gap: 12px;
      }

      .layout-title {
        min-width: min(100%, 440px);
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1.1rem;
      }

      h3 {
        color: #5a6575;
        font-size: 0.9rem;
      }

      p,
      output,
      span {
        color: #5a6575;
      }

      output {
        font-weight: 700;
      }

      button {
        min-height: 38px;
        border: 1px solid #b8c4d4;
        border-radius: 6px;
        padding: 8px 12px;
        color: #172033;
        background: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button:hover {
        border-color: #1f6feb;
        color: #1f6feb;
      }

      #toggle-grid-density[aria-pressed="true"] {
        border-color: #1f6feb;
        color: #ffffff;
        background: #1f6feb;
      }

      .metric-card {
        display: grid;
        gap: 8px;
        min-width: 0;
        padding: 16px;
        border-top-width: 4px;
      }

      .metric-card strong {
        color: #172033;
        font-size: 1.65rem;
      }

      .metric-card-blue {
        border-top-color: #1f6feb;
      }

      .metric-card-green {
        border-top-color: #2da44e;
      }

      .metric-card-amber {
        border-top-color: #bf8700;
      }

      .metric-card-red {
        border-top-color: #cf222e;
      }

      .layout-panel {
        display: grid;
        align-content: start;
        gap: 14px;
        min-width: 0;
      }

      .filter-bar button {
        background: #f6f8fa;
      }

      .service-list {
        margin-top: 4px;
      }

      .service-row {
        min-height: 42px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 0 12px;
        background: #fbfcfe;
      }

      .service-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #2da44e;
      }

      code {
        color: #172033;
        font-family: "Cascadia Code", "Fira Code", ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.86rem;
      }

      .center-preview {
        border: 1px dashed #b8c4d4;
        border-radius: 8px;
        padding: 18px;
        background: #fbfcfe;
      }

      .center-content {
        max-width: 390px;
      }

      img {
        display: block;
        width: 100%;
        max-width: 360px;
        height: auto;
        border: 1px solid #d8e0ea;
        border-radius: 8px;
      }

      @media (max-width: 760px) {
        .layout-shell {
          padding: 20px 0;
        }

        .layout-container {
          padding-left: 16px !important;
          padding-right: 16px !important;
        }

        .layout-header-row {
          align-items: flex-start !important;
        }

        .layout-workspace {
          grid-template-columns: 1fr !important;
        }

        .metric-card strong {
          font-size: 1.35rem;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./layout-demo.js"></script>
  </body>
</html>
