    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        color: #172033;
        background: #f5f7fa;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        line-height: 1.5;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid #1f6feb;
        outline-offset: 2px;
      }

      #app {
        min-height: 100vh;
      }

      .components-workspace {
        display: grid;
        grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
        width: min(100%, 1280px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 16px;
        box-sizing: border-box;
      }

      .components-menu,
      .components-router-panel {
        min-width: 0;
      }

      .components-menu {
        display: grid;
        gap: 12px;
        align-content: start;
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        padding: 16px;
        background: #ffffff;
      }

      .components-menu-intro {
        display: grid;
        gap: 6px;
      }

      .components-menu-intro h2,
      .components-menu-intro p,
