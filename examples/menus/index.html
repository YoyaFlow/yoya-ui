<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yoya-ui 菜单组件演示</title>
    <style>
      :root {
        color: #172033;
        background: #f5f7fa;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      body {
        margin: 0;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      p,
      span {
        color: #5a6575;
      }

      .menus-shell {
        min-height: 100vh;
        padding: 32px 0;
      }

      .menus-container {
        display: grid;
        gap: 24px;
        width: min(100%, 1180px);
        margin: 0 auto;
        padding: 0 20px;
        box-sizing: border-box;
      }

      .menus-header {
        display: grid;
        gap: 8px;
        border: 1px solid #d8e0ea;
        border-radius: 10px;
        padding: 20px;
        background: #ffffff;
      }

      .menus-header a {
        width: max-content;
        color: #2563eb;
        font-size: 0.88rem;
        text-decoration: none;
      }

      .menus-header a:hover,
      .menus-header a:focus-visible {
        text-decoration: underline;
      }

      .menus-examples {
        width: 100%;
      }

      .menu-example {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        align-items: start;
        width: 100%;
      }

      .menu-example-preview {
        min-width: 0;
      }

      .source-panel {
        display: grid;
        box-sizing: border-box;
        gap: 10px;
        min-width: 0;
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        padding: 16px;
        background: #ffffff;
      }

      .source-code {
        max-height: 620px;
        min-height: 260px;
        margin: 0;
        overflow: auto;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 14px;
        background: #fbfcfe;
      }

      .source-code code {
        display: block;
        min-width: max-content;
        color: #172033;
        font-family: 'Cascadia Code', 'Fira Code', ui-monospace, Consolas, monospace;
        font-size: 0.84rem;
        line-height: 1.55;
        white-space: pre;
      }

      .overlay-actions {
        align-items: stretch;
        flex-wrap: wrap;
        gap: 12px !important;
      }

      .context-demo-target {
        display: grid;
        gap: 4px;
        min-width: 220px;
        border: 1px dashed #94a3b8;
        border-radius: 6px;
        padding: 10px 12px;
        background: #fbfcfe;
        cursor: context-menu;
      }

      .context-demo-target strong {
        color: #172033;
      }

      .yoya-vbutton:hover {
        filter: brightness(0.98);
      }

      .yoya-vbutton:disabled {
        pointer-events: none;
      }

      .yoya-vmessage-container {
        width: min(360px, calc(100vw - 32px));
      }

      @media (max-width: 900px) {
        .menus-shell {
          padding: 20px 0;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./menus-demo.js"></script>
  </body>
</html>
