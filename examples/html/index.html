<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yoya-ui 基础元素示例</title>
    <style>
      body {
        margin: 0;
        color: #172033;
        background: #f6f8fb;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .example-shell {
        max-width: 920px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      .example-header,
      .example-block {
        margin-bottom: 20px;
        border: 1px solid #dbe2ee;
        border-radius: 8px;
        padding: 20px;
        background: #ffffff;
      }

      .example-block {
        display: grid;
        gap: 12px;
      }

      h1,
      h2,
      h3 {
        margin: 0 0 12px;
        letter-spacing: 0;
      }

      h3 {
        font-size: 1rem;
      }

      p {
        margin: 0;
        color: #5b6678;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      a {
        color: #246bfe;
        font-weight: 650;
        text-decoration: none;
      }

      article,
      aside,
      footer {
        color: #4c586b;
      }

      form,
      fieldset {
        display: grid;
        gap: 12px;
      }

      form {
        max-width: 360px;
      }

      fieldset {
        margin: 0;
        border: 1px solid #dbe2ee;
        border-radius: 8px;
        padding: 16px;
      }

      legend,
      label {
        font-weight: 650;
      }

      input,
      select,
      textarea {
        border: 1px solid #c8d1df;
        border-radius: 6px;
        padding: 9px 10px;
        font: inherit;
      }

      button {
        width: fit-content;
        border: 0;
        border-radius: 6px;
        padding: 9px 14px;
        color: #ffffff;
        background: #246bfe;
        font: inherit;
        font-weight: 700;
      }

      button:hover {
        background: #195be0;
      }

      output,
      #save-status {
        color: #172033;
        font-weight: 650;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid #dbe2ee;
        padding: 10px;
        text-align: left;
      }

      figure {
        margin: 0;
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
        border: 1px solid #dbe2ee;
        border-radius: 8px;
      }

      figcaption,
      small {
        color: #5b6678;
      }

      details {
        display: grid;
        gap: 10px;
      }

      summary {
        cursor: pointer;
        font-weight: 700;
      }

      progress,
      meter {
        width: min(360px, 100%);
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./basic-elements.js"></script>
  </body>
</html>
