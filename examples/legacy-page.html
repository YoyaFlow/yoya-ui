<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>旧系统页面（多页跳转目标）</title>
    <style>
      body {
        background: #ffffff;
        color: #172033;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 32px;
      }

      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }

      p {
        color: #475569;
        margin: 0 0 8px;
      }

      code {
        background: #f1f5f9;
        border-radius: 4px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <h1>旧系统页面</h1>
    <p>这是一个独立的 HTML 文档，没有引入 yoya-ui。</p>
    <p>
      文档路由把<strong>整页跳转</strong>交给浏览器：地址栏换成这个文件， SPA 不再接管后续导航。
    </p>
    <p>回到演示：<code>router-document.html</code> / <code>router-views-document.html</code></p>
  </body>
</html>
