<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yoya-ui I18n 语言切换演示</title>
    <style>
      body {
        margin: 0;
        color: #18202f;
        background: #f4f7fb;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .i18n-shell {
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      .i18n-header,
      .syntax-panel,
      .feature-list {
        border: 1px solid #d8e0ee;
        border-radius: 8px;
        background: #ffffff;
      }

      .i18n-header,
      .syntax-panel {
        display: grid;
        gap: 12px;
        margin-bottom: 18px;
        padding: 22px;
      }

      h1,
      h2,
      p {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1.1rem;
      }

      p,
      li,
      output {
        color: #556174;
      }

      .language-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 14px;
      }

      button {
        border: 1px solid #b9c6d9;
        border-radius: 6px;
        padding: 9px 14px;
        color: #18202f;
        background: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button[aria-pressed="true"] {
        border-color: #246bfe;
        color: #ffffff;
        background: #246bfe;
      }

      .language-status {
        margin-bottom: 18px;
        font-weight: 700;
      }

      pre {
        overflow-x: auto;
        margin: 0;
        border-radius: 8px;
        padding: 14px;
        color: #d8e6ff;
        background: #172033;
      }

      code {
        font-family: "Cascadia Code", "Fira Code", ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .feature-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 20px 20px 20px 40px;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./language-switch.js"></script>
  </body>
</html>
