name: Core benchmark

# 基准不进 PR 触发（噪声与耗时）：只在夜间与手动触发时跑。
# 护栏违反 → 失败；时间类指标只做软告警（同机同版本才有意义）。
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: js-framework-benchmark style core benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist entries
        run: npm run build

      - name: Run core benchmark
        run: npm run bench:jfb

      - name: Check report documents match the result JSON
        run: npm run verify:bench

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/latest.json
