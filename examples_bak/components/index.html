<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yoya-ui 组件目录</title>
    <style>
      body {
        margin: 0;
        color: #172033;
        background: #f5f7fa;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1.2rem;
      }

      h3 {
        font-size: 1rem;
      }

      p,
      span {
        color: #5a6575;
      }

      .components-shell {
        min-height: 100vh;
        padding: 24px 0;
      }

      .components-container {
        display: grid;
        gap: 18px;
        width: min(100%, 1280px);
        margin: 0 auto;
        padding: 0 16px;
        box-sizing: border-box;
      }

      .components-header,
      .components-sidebar,
      .components-panel {
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        background: #ffffff;
      }

      .components-header {
        display: grid;
        gap: 6px;
        padding: 20px;
      }

      .components-workspace {
        display: grid;
        gap: 16px;
        align-items: start;
      }

      .components-sidebar {
        display: grid;
        align-content: start;
        gap: 12px;
        min-width: 0;
        padding: 16px;
      }

      .components-menu {
        width: 100%;
        min-width: 0;
        padding: 0;
      }

      .components-panel {
        min-width: 0;
        overflow: hidden;
      }

      .components-router-views {
        min-height: 100%;
      }

      .components-home {
        display: grid;
        gap: 16px;
      }

      .components-home-header {
        display: grid;
        gap: 6px;
      }

      .components-home-stats {
        display: grid;
      }

      .components-home-stat,
      .components-home-category {
        display: grid;
        gap: 6px;
        min-width: 0;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 14px;
        background: #fbfcfe;
      }

      .components-home-stat strong {
        color: #172033;
        font-size: 1.35rem;
      }

      .components-home-category strong {
        color: #172033;
      }

      .components-home-results,
      .components-home-catalog,
      .components-home-sources,
      .demo-category-preview-grid,
      .demo-category-scenarios,
      .demo-detail-section {
        display: grid;
        gap: 12px;
      }

      .demo-home-results-grid,
      .demo-category-card-grid,
      .demo-scenario-card-grid,
      .demo-source-summary-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }

      .demo-search-row {
        display: grid;
        gap: 8px;
      }

      .demo-metric-card,
      .demo-category-card,
      .demo-component-card,
      .demo-scenario-card,
      .demo-source-summary,
      .demo-empty-state,
      .demo-boundary-card {
        display: grid;
        gap: 8px;
        min-width: 0;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 14px;
        background: #fbfcfe;
      }

      .demo-metric-card strong {
        color: #172033;
        font-size: 1.35rem;
      }

      .demo-category-card-meta,
      .demo-component-card-meta,
      .demo-scenario-meta,
      .demo-source-summary-meta {
        display: grid;
        gap: 4px;
        color: #5a6575;
        font-size: 0.88rem;
      }

      .demo-tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .demo-tag {
        display: inline-flex;
        align-items: center;
        border: 1px solid #d7dee8;
        border-radius: 999px;
        padding: 3px 10px;
        color: #445065;
        background: #f8fafc;
        font-size: 0.78rem;
      }

      .demo-breadcrumb {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        color: #687386;
        font-size: 0.86rem;
      }

      .demo-breadcrumb .yoya-vlink {
        color: #2563eb;
      }

      .demo-category-boundary {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .demo-category-boundary-card {
        min-width: 0;
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        padding: 14px;
        background: #ffffff;
      }

      .demo-category-boundary-card h3 {
        margin-bottom: 6px;
        color: #172033;
        font-size: 0.94rem;
      }

      .demo-category-boundary-card p {
        line-height: 1.55;
      }

      .demo-scenario-card,
      .demo-source-summary {
        align-content: start;
      }

      .demo-scenario-card h3,
      .demo-source-summary h3 {
        color: #172033;
      }

      .demo-source-summary p {
        overflow-wrap: anywhere;
        font-family: 'Cascadia Code', 'Fira Code', ui-monospace, Consolas, monospace;
        font-size: 0.82rem;
      }

      .demo-source-summary-grid {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }

      .demo-detail-layout {
        display: grid;
        align-items: start;
      }

      .demo-live-panel {
        display: grid;
        gap: 12px;
        min-width: 0;
      }

      .demo-api-table {
        min-width: 0;
        overflow: auto;
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        background: #ffffff;
      }

      .demo-api-table-inner {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
      }

      .demo-api-table-inner th,
      .demo-api-table-inner td {
        padding: 10px 12px;
        border-bottom: 1px solid #e2e8f0;
        text-align: left;
        vertical-align: top;
      }

      .demo-api-table-inner th {
        background: #f8fafc;
        color: #344054;
        font-size: 0.85rem;
        font-weight: 700;
      }

      .demo-boundary-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .demo-boundary-card h3 {
        color: #172033;
        font-size: 0.94rem;
      }

      .demo-boundary-card ul {
        margin: 0;
        padding-left: 18px;
        color: #4b5563;
      }

      .components-category-page {
        display: grid;
        gap: 18px;
      }

      .component-category-header {
        display: grid;
        gap: 6px;
        border-left: 4px solid #2563eb;
        padding: 4px 0 4px 12px;
      }

      .component-category-header h2 {
        color: #172033;
        font-size: 1.1rem;
      }

      .component-example {
        display: grid;
        gap: 12px;
        align-items: start;
        width: 100%;
      }

      .demo-empty-state p {
        color: #5a6575;
      }

      .source-panel {
        display: grid;
        box-sizing: border-box;
        gap: 10px;
        min-width: 0;
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        padding: 16px;
        background: #ffffff;
      }

      .source-code {
        max-height: 620px;
        min-height: 260px;
        margin: 0;
        overflow: auto;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 14px;
        background: #fbfcfe;
      }

      .source-code code {
        display: block;
        min-width: max-content;
        color: #172033;
        font-family: 'Cascadia Code', 'Fira Code', ui-monospace, Consolas, monospace;
        font-size: 0.84rem;
        line-height: 1.55;
        white-space: pre;
      }

      @media (max-width: 900px) {
        .components-shell {
          padding: 20px 0;
        }

        .components-workspace,
        .components-home-stats,
        .demo-category-boundary,
        .demo-boundary-grid,
        .demo-detail-layout {
          grid-template-columns: 1fr !important;
        }

        .components-sidebar {
          max-height: 52px;
          overflow: visible;
        }

        .components-sidebar .yoya-vsidebar[data-collapsed='true'] {
          width: 72px !important;
          height: 52px;
          min-height: 52px;
        }

        .components-sidebar .yoya-vsidebar[data-collapsed='true'] .yoya-vsidebar-menu {
          display: none;
        }

        .components-sidebar:has(.yoya-vsidebar[data-collapsed='false']) {
          max-height: 60vh;
          overflow: auto;
        }

        .components-sidebar .yoya-vsidebar[data-collapsed='false'] {
          width: 100% !important;
          max-width: 100%;
        }
      }

      @media (max-width: 520px) {
        .components-container {
          padding-left: 12px;
          padding-right: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./components-demo.js"></script>
  </body>
</html>
