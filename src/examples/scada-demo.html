<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工业 SCADA · 第一人称数字孪生</title>
    <style>
      body {
        background: #0b1220;
        height: 100vh;
        margin: 0;
        overflow: hidden;
      }

      #app {
        height: 100vh;
      }

      .scada-viewport {
        cursor: crosshair;
        touch-action: none;
      }

      .hud-panel {
        backdrop-filter: blur(8px);
        background: rgba(15, 23, 42, 0.76);
        border: 1px solid rgba(148, 163, 184, 0.26);
        border-radius: 12px;
        box-sizing: border-box;
        color: #e2e8f0;
        padding: 10px 12px;
        pointer-events: auto;
      }

      .hud-panel h3 {
        font-size: 13px;
        letter-spacing: 0.08em;
        margin: 0 0 8px;
        text-transform: uppercase;
      }

      .hud-panel p {
        font-size: 13px;
        margin: 4px 0;
      }

      .scada-top-left h1 {
        font-size: 1.25rem;
        margin: 0;
      }

      .scada-top-left p {
        margin: 2px 0;
      }

      .scada-device-hud [data-selected='true'] {
        outline: 2px solid #38bdf8;
        outline-offset: 1px;
      }

      .scada-alarm-hud {
        scrollbar-width: thin;
      }

      .scada-bottom-center p {
        color: #cbd5e1;
        font-size: 12px;
        letter-spacing: 0.04em;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      import '../yoya.ui.css';
      import { ScadaTwinStandalone } from './scada-demo/scada-app.js';

      ScadaTwinStandalone().render().bindTo('#app');
    </script>
  </body>
</html>
