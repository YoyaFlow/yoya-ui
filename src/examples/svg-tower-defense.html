<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yoya-ui SVG 塔防小游戏</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@yoyaflow/yoya-ui@0.5.0/dist/yoya.ui.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background: #0b1220;
        color: #e2e8f0;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 20px;
      }

      .game-card {
        background: #111a2c;
        border: 1px solid #24324d;
        border-radius: 16px;
        box-shadow: 0 20px 50px rgb(0 0 0 / 45%);
        margin: 0 auto;
        max-width: 1240px;
        padding: 18px;
      }

      .game-head {
        align-items: baseline;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .game-head h1 {
        font-size: 20px;
        margin: 0;
      }

      .game-head p {
        color: #8fa3bf;
        font-size: 13px;
        margin: 0;
      }

      .game-layout {
        align-items: stretch;
        display: flex;
        gap: 16px;
      }

      .playfield {
        background: #101a2c;
        border: 1px solid #2b3d5f;
        border-radius: 12px;
        display: block;
        height: auto;
        max-height: 640px;
        width: 100%;
      }

      .sidebar {
        background: #131e33;
        border: 1px solid #24324d;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 250px;
        padding: 14px;
        width: 280px;
      }

      .stat-row {
        display: flex;
        gap: 10px;
      }

      .stat-box {
        background: #0f172a;
        border: 1px solid #22314e;
        border-radius: 8px;
        flex: 1;
        padding: 8px 10px;
      }

      .stat-box span {
        color: #8fa3bf;
        display: block;
        font-size: 11px;
      }

      .stat-box strong {
        font-size: 18px;
      }

      .palette-label {
        color: #8fa3bf;
        font-size: 12px;
        margin: 2px 0 0;
      }

      .palette {
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr;
      }

      .palette-button {
        background: #18233a;
        border: 1px solid #2e3f5e;
        border-radius: 8px;
        color: #e2e8f0;
        cursor: pointer;
        font: inherit;
        padding: 8px 10px;
        text-align: left;
      }

      .palette-button:hover {
        border-color: #4b6a9b;
      }

      .palette-button small {
        color: #94a8c5;
        display: block;
        font-size: 11px;
      }

      .wave-button {
        background: #1d4ed8;
        border: 1px solid #3b82f6;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        padding: 10px;
      }

      .wave-button:disabled {
        background: #22304a;
        border-color: #33435f;
        color: #8fa3bf;
        cursor: not-allowed;
      }

      .game-message {
        color: #8fa3bf;
        font-size: 13px;
        line-height: 1.5;
        min-height: 40px;
      }

      .road {
        fill: #2a3b57;
        stroke: #22314e;
      }

      .build-cell {
        fill: #1b2940;
        stroke: #223252;
      }

      .build-cell:hover {
        fill: #243957;
      }

      .placement-preview {
        pointer-events: none;
      }

      .placement-preview .preview-range {
        fill: rgb(56 189 248 / 8%);
        stroke-dasharray: 4 6;
        stroke-width: 1.5;
      }

      .placement-preview .preview-tower {
        stroke: #0f172a;
        stroke-width: 1.5;
      }

      .tower-range {
        fill: none;
        stroke: #38bdf8;
        stroke-dasharray: 4 6;
        stroke-width: 1.5;
        pointer-events: none;
      }

      .tower {
        cursor: pointer;
        pointer-events: all;
      }

      .tower-body {
        stroke: #0f172a;
        stroke-width: 1.5;
      }

      .tower-barrel {
        stroke-width: 5;
        stroke-linecap: round;
      }

      .tower--arrow .tower-body {
        fill: #eab308;
      }

      .tower--arrow .tower-barrel {
        stroke: #854d0e;
      }

      .tower--cannon .tower-body {
        fill: #334155;
      }

      .tower--cannon .tower-barrel {
        stroke: #0f172a;
      }

      .tower--frost .tower-body {
        fill: #0ea5e9;
      }

      .tower--frost .tower-barrel {
        stroke: #0369a1;
      }

      .enemy,
      .projectile {
        pointer-events: none;
      }

      .enemy-body {
        stroke: #0f172a;
        stroke-width: 1.5;
      }

      .enemy--basic .enemy-body {
        fill: #f87171;
      }

      .enemy--fast .enemy-body {
        fill: #c084fc;
      }

      .enemy--tank .enemy-body {
        fill: #94a3b8;
      }

      .enemy-hp-bg {
        fill: #0b1220;
      }

      .enemy-hp-fill {
        fill: #22c55e;
      }

      .enemy--tank .enemy-hp-fill {
        fill: #f59e0b;
      }

      .projectile-circle {
        stroke: #0f172a;
        stroke-width: 1;
      }

      .projectile--arrow .projectile-circle {
        fill: #fde047;
      }

      .projectile--cannon .projectile-circle {
        fill: #94a3b8;
      }

      .projectile--frost .projectile-circle {
        fill: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      import {
        computed,
        div,
        ref,
        svg,
        SvgElementNode
      } from 'https://cdn.jsdelivr.net/npm/@yoyaflow/yoya-ui@0.5.0/dist/yoya.ui.js';

      /*
       * 组件划分：
       * - GameModel：纯游戏状态与规则（波次/金钱/生命/索敌/弹道结算），不碰 DOM；
       * - Enemy / Tower / Projectile：各自用 ref 持有会驱动视图的值，视图直接绑定句柄；
       * - Playfield：SVG 场景与可点击网格，负责把实体组件组合进同一棵树；
       * - Hud：侧边栏（资源/波次/炮塔选择/开始按钮）；
       * - TowerDefenseApp：页面壳，连接模型、视图与动画循环。
       */

      const FIELD = {
        cols: 20,
        rows: 12,
        cell: 45,
        originX: 30,
        originY: 30
      };

      const TOWER_DEFS = {
        arrow: {
          name: '箭塔',
          cost: 50,
          range: 135,
          damage: 10,
          interval: 480,
          projectileSpeed: 420,
          bullet: 'arrow',
          color: '#eab308'
        },
        cannon: {
          name: '炮塔',
          cost: 85,
          range: 165,
          damage: 28,
          interval: 1150,
          projectileSpeed: 330,
          bullet: 'cannon',
          color: '#94a3b8'
        },
        frost: {
          name: '冰塔',
          cost: 65,
          range: 120,
          damage: 5,
          interval: 850,
          projectileSpeed: 360,
          bullet: 'frost',
          slowFactor: 0.45,
          slowMs: 1500,
          color: '#38bdf8'
        }
      };

      const ENEMY_DEFS = {
        basic: { name: '小怪', radius: 10, hp: 46, speed: 58, reward: 8 },
        fast: { name: '迅捷', radius: 8, hp: 26, speed: 108, reward: 11 },
        tank: { name: '铁甲', radius: 14, hp: 135, speed: 34, reward: 20 }
      };

      function cellRect(col, row) {
        return {
          x: FIELD.originX + col * FIELD.cell,
          y: FIELD.originY + row * FIELD.cell,
          width: FIELD.cell,
          height: FIELD.cell
        };
      }

      function cellCenter(col, row) {
        const rect = cellRect(col, row);
        return { x: rect.x + rect.width / 2, y: rect.y + rect.height / 2 };
      }

      function buildPath() {
        const pathCells = new Set();
        const points = [];
        const rowY = (row) => cellCenter(0, row).y;
        const colX = (col) => cellCenter(col, 0).x;

        for (let col = 0; col <= 4; col += 1) {
          pathCells.add(`${col},2`);
        }
        for (let row = 3; row <= 8; row += 1) {
          pathCells.add(`4,${row}`);
        }
        for (let col = 5; col <= 9; col += 1) {
          pathCells.add(`${col},8`);
        }
        for (let row = 3; row <= 7; row += 1) {
          pathCells.add(`9,${row}`);
        }
        for (let col = 10; col <= 14; col += 1) {
          pathCells.add(`${col},2`);
        }
        for (let row = 3; row <= 8; row += 1) {
          pathCells.add(`14,${row}`);
        }
        for (let col = 15; col <= 19; col += 1) {
          pathCells.add(`${col},8`);
        }

        points.push({ x: -18, y: rowY(2) });
        for (let col = 0; col <= 4; col += 1) {
          points.push({ x: colX(col), y: rowY(2) });
        }
        points.push({ x: colX(4), y: rowY(8) });
        for (let col = 5; col <= 9; col += 1) {
          points.push({ x: colX(col), y: rowY(8) });
        }
        points.push({ x: colX(9), y: rowY(2) });
        for (let col = 10; col <= 14; col += 1) {
          points.push({ x: colX(col), y: rowY(2) });
        }
        points.push({ x: colX(14), y: rowY(8) });
        for (let col = 15; col <= 19; col += 1) {
          points.push({ x: colX(col), y: rowY(8) });
        }
        points.push({ x: 930, y: rowY(8) });

        return { pathCells, points };
      }

      const PATH = buildPath();

      function buildWavePlan(waveNumber) {
        const plan = [];
        const basicCount = 6 + waveNumber;

        for (let index = 0; index < basicCount; index += 1) {
          plan.push({ kind: 'basic', at: 500 + index * 720 });
        }

        if (waveNumber >= 2) {
          const fastCount = Math.min(2 + Math.floor(waveNumber / 2), 6);
          for (let index = 0; index < fastCount; index += 1) {
            plan.push({ kind: 'fast', at: 1400 + index * 820 });
          }
        }

        if (waveNumber >= 3) {
          const tankCount = Math.min(1 + Math.floor(waveNumber / 3), 4);
          for (let index = 0; index < tankCount; index += 1) {
            plan.push({ kind: 'tank', at: 2600 + index * 1500 });
          }
        }

        return plan.sort((a, b) => a.at - b.at);
      }

      function Enemy({ kind, startX, startY, waveNumber, startPathIndex }) {
        const def = ENEMY_DEFS[kind];
        const hpScale = 1 + (waveNumber - 1) * 0.18;
        const maxHp = Math.round(def.hp * hpScale);
        const barWidth = def.radius * 2 + 4;

        const positionX = ref(startX);
        const positionY = ref(startY);
        const hp = ref(maxHp);
        const barWidthValue = computed(() => String((hp.value / maxHp) * barWidth));
        const transform = computed(() => `translate(${positionX.value} ${positionY.value})`);

        // 只服务规则、不驱动视图的值留在普通变量里
        let pathIndex = startPathIndex;
        let alive = true;
        let slowUntil = 0;
        let slowFactor = 1;
        let node = null;

        return {
          render() {
            node = new SvgElementNode('g', (group) => {
              group.className(['enemy', `enemy--${kind}`]);
              group.attr('transform', transform);

              group.rect({
                class: 'enemy-hp-bg',
                x: -def.radius - 2,
                y: -def.radius - 12,
                width: barWidth,
                height: 4,
                rx: 2
              });

              group.rect((bar) => {
                bar.className('enemy-hp-fill');
                bar.attr({
                  x: -def.radius - 2,
                  y: -def.radius - 12,
                  height: 4,
                  rx: 2
                });
                bar.attr('width', barWidthValue);
              });

              group.circle({ class: 'enemy-body', r: def.radius });
            });
            return node;
          },

          get kind() {
            return kind;
          },

          get x() {
            return positionX.value;
          },

          get y() {
            return positionY.value;
          },

          get hp() {
            return hp.value;
          },

          get alive() {
            return alive;
          },

          hit(damage, now, slowMs, nextSlowFactor) {
            const nextHp = Math.max(0, hp.value - damage);
            if (slowMs > 0 && nextSlowFactor < 1) {
              slowUntil = Math.max(slowUntil, now + slowMs);
              slowFactor = nextSlowFactor;
            }

            hp.value = nextHp;
            alive = nextHp > 0;
            return nextHp <= 0;
          },

          step(dtSeconds, now) {
            if (!alive) {
              return { arrived: false };
            }

            const slowed = now < slowUntil ? slowFactor : 1;
            const speed = def.speed * slowed;
            let remaining = speed * dtSeconds;
            let x = positionX.value;
            let y = positionY.value;

            while (remaining > 0 && pathIndex < PATH.points.length) {
              const target = PATH.points[pathIndex];
              const dx = target.x - x;
              const dy = target.y - y;
              const distance = Math.hypot(dx, dy);

              if (distance <= remaining) {
                x = target.x;
                y = target.y;
                remaining -= distance;
                pathIndex += 1;
              } else {
                x += (dx / distance) * remaining;
                y += (dy / distance) * remaining;
                remaining = 0;
              }
            }

            const arrived = pathIndex >= PATH.points.length;
            positionX.value = x;
            positionY.value = y;
            return { arrived };
          },

          destroy() {
            node?.destroy();
          }
        };
      }

      function Tower({ col, row, kind, onPick }) {
        const def = TOWER_DEFS[kind];
        const center = cellCenter(col, row);
        const angle = ref(-90);
        const selected = ref(false);
        const barrelX = computed(() => String(Math.cos((angle.value * Math.PI) / 180) * 16));
        const barrelY = computed(() => String(Math.sin((angle.value * Math.PI) / 180) * 16));
        const rangeOpacity = computed(() => (selected.value ? '1' : '0'));

        let cd = 0;
        let node = null;

        const tower = {
          render() {
            node = new SvgElementNode('g', (group) => {
              group.className(['tower', `tower--${kind}`]);
              group.attr('transform', `translate(${center.x} ${center.y})`);
              group.on('click', () => onPick(tower));

              // 已放置炮塔的射程圈：点击选中时显示，再次点击取消时隐藏。
              group.circle((range) => {
                range.className('tower-range');
                range.attr('r', def.range);
                range.style('opacity', rangeOpacity);
              });

              group.circle({ class: 'tower-body', r: 15 });
              group.line((barrel) => {
                barrel.className('tower-barrel');
                barrel.attr({ x1: 0, y1: 0 });
                barrel.attr('x2', barrelX);
                barrel.attr('y2', barrelY);
              });
              group.circle({ r: 6, fill: '#0f172a' });
            });
            return node;
          },

          get kind() {
            return kind;
          },

          get col() {
            return col;
          },

          get row() {
            return row;
          },

          tick(dtMs) {
            const ready = cd <= 0;
            cd = Math.max(0, cd - dtMs);
            return ready;
          },

          fire(nextAngle) {
            angle.value = nextAngle;
            cd = def.interval;
          },

          select(next) {
            selected.value = next;
            return this;
          },

          destroy() {
            node?.destroy();
          }
        };

        return tower;
      }

      /*
       * 放置预览：选中炮塔类型后，鼠标悬停到场地格子时显示
       * 半透明的射程圈与炮塔占位，提示这块地放下去能覆盖多大范围。
       * 不可放置（道路/已有炮塔/金币不足）时射程圈显示为红色。
       */
      function TowerPlacementPreview() {
        const visible = ref(false);
        const positionX = ref(0);
        const positionY = ref(0);
        const range = ref(0);
        const color = ref('#38bdf8');
        const valid = ref(true);

        const transform = computed(() => `translate(${positionX.value} ${positionY.value})`);
        const opacity = computed(() => (visible.value ? '1' : '0'));
        const rangeRadius = computed(() => String(range.value));
        const rangeFill = computed(() =>
          valid.value ? 'rgb(56 189 248 / 8%)' : 'rgb(239 68 68 / 8%)'
        );
        const rangeStroke = computed(() => (valid.value ? color.value : '#ef4444'));

        let node = null;

        return {
          render() {
            node = new SvgElementNode('g', (group) => {
              group.className('placement-preview');
              group.attr('transform', transform);
              group.attr('opacity', opacity);

              group.circle((ring) => {
                ring.className('preview-range');
                ring.attr('r', rangeRadius);
                ring.style('fill', rangeFill);
                ring.style('stroke', rangeStroke);
              });

              group.circle((mark) => {
                mark.className('preview-tower');
                mark.attr('r', '15');
                mark.style('fill', color);
              });
            });
            return node;
          },

          show(info) {
            positionX.value = info.x;
            positionY.value = info.y;
            range.value = info.range;
            color.value = info.color;
            valid.value = info.valid;
            visible.value = true;
            return this;
          },

          hide() {
            visible.value = false;
            return this;
          }
        };
      }

      function Projectile({ startX, startY, target, kind, speed, damage, onHit }) {
        const positionX = ref(startX);
        const positionY = ref(startY);
        const transform = computed(() => `translate(${positionX.value} ${positionY.value})`);

        let node = null;

        return {
          render() {
            node = new SvgElementNode('g', (group) => {
              group.className(['projectile', `projectile--${kind}`]);
              group.attr('transform', transform);
              group.circle({ class: 'projectile-circle', r: kind === 'cannon' ? 6 : 4 });
            });
            return node;
          },

          get alive() {
            return true;
          },

          get x() {
            return positionX.value;
          },

          get y() {
            return positionY.value;
          },

          step(dtSeconds, targetX, targetY, targetRadius) {
            const dx = targetX - positionX.value;
            const dy = targetY - positionY.value;
            const distance = Math.hypot(dx, dy);
            const stepDistance = speed * dtSeconds;

            if (distance <= stepDistance + targetRadius) {
              onHit();
              return { done: true };
            }

            positionX.value += (dx / distance) * stepDistance;
            positionY.value += (dy / distance) * stepDistance;
            return { done: false };
          },

          destroy() {
            node?.destroy();
          }
        };
      }

      function Playfield({ onCellClick, resolvePreview }) {
        let fieldNode = null;
        const preview = TowerPlacementPreview();

        function addEntity(component) {
          fieldNode?.child(component);
        }

        return {
          render() {
            return svg((field) => {
              fieldNode = field;
              field.className('playfield');
              field.attr({
                viewBox: '0 0 900 600',
                role: 'img',
                'aria-label': '塔防游戏战场'
              });

              for (let row = 0; row < FIELD.rows; row += 1) {
                for (let col = 0; col < FIELD.cols; col += 1) {
                  const rect = cellRect(col, row);
                  const isRoad = PATH.pathCells.has(`${col},${row}`);

                  field.rect(
                    {
                      class: isRoad ? 'road' : 'build-cell',
                      ...rect,
                      rx: 3,
                      'data-cell': `${col},${row}`
                    },
                    (cell) => {
                      const cellInfo = { col, row };

                      // 点击落地；mouseenter 时用 resolvePreview 获取“这个格子能否放、范围多大”。
                      cell.on('click', () => {
                        onCellClick(cellInfo);
                        preview.hide();
                      });
                      cell.on('mouseenter', () => {
                        const info = resolvePreview?.(cellInfo);
                        if (info) {
                          preview.show(info);
                        } else {
                          preview.hide();
                        }
                      });
                      cell.on('mouseleave', () => preview.hide());
                    }
                  );
                }
              }

              // 预览图层最后追加，绘制在所有格子之上。
              field.child(preview);
            });
          },

          addEntity
        };
      }

      function Hud({ onChooseTower, onStartWave }) {
        const towerOrder = ['arrow', 'cannon', 'frost'];
        const gold = ref(0);
        const lives = ref(0);
        const wave = ref(0);
        const waveActive = ref(false);
        const nextIn = ref(0);
        const gameOver = ref(false);
        const selectedType = ref(null);
        const messageText = ref('选择炮塔类型后悬停空地预览攻击范围，点击放置');

        const goldText = computed(() => String(gold.value));
        const livesText = computed(() => String(lives.value));
        const waveText = computed(() => String(wave.value));
        const message = computed(() => messageText.value);
        const waveLabel = computed(() => {
          if (gameOver.value) {
            return '游戏结束';
          }
          if (waveActive.value) {
            return '波次进行中…';
          }
          if (nextIn.value > 0) {
            return `${nextIn.value} 秒后自动开始下一波`;
          }
          return `开始第 ${wave.value + 1} 波`;
        });

        return {
          render() {
            return div((sidebar) => {
              sidebar.className('sidebar');

              sidebar.div((statRow) => {
                statRow.className('stat-row');

                statRow.div((box) => {
                  box.className('stat-box');
                  box.span('金币');
                  box.strong((value) => value.text(goldText));
                });

                statRow.div((box) => {
                  box.className('stat-box');
                  box.span('生命');
                  box.strong((value) => value.text(livesText));
                });

                statRow.div((box) => {
                  box.className('stat-box');
                  box.span('波次');
                  box.strong((value) => value.text(waveText));
                });
              });

              sidebar.p('炮塔');
              sidebar.div((palette) => {
                palette.className('palette');

                towerOrder.forEach((kind) => {
                  const def = TOWER_DEFS[kind];
                  palette.button((button) => {
                    button.attr({ class: 'palette-button', 'data-tower-kind': kind });
                    button.style(
                      'box-shadow',
                      computed(() => (selectedType.value === kind ? '0 0 0 2px #facc15' : null))
                    );
                    button.text(def.name);
                    button.small(`花费 ${def.cost} · 伤害 ${def.damage}`);
                    button.on('click', () => {
                      selectedType.value = kind;
                      onChooseTower(kind);
                    });
                  });
                });
              });

              sidebar.button((button) => {
                button.className('wave-button');
                button.on('click', onStartWave);
                button.text(waveLabel);
              });

              sidebar.p((line) => {
                line.className('game-message');
                line.text(message);
              });
            });
          },

          update(stats) {
            gold.value = stats.gold;
            lives.value = stats.lives;
            wave.value = stats.wave;
            waveActive.value = stats.waveActive;
            nextIn.value = stats.nextIn;
            gameOver.value = stats.gameOver;
            selectedType.value = stats.selectedType;
            messageText.value = stats.message;
            return this;
          }
        };
      }

      function GameModel() {
        const model = {
          gold: 140,
          lives: 20,
          waveNumber: 0,
          waveActive: false,
          countdownMs: 0,
          gameOver: false,
          message: '选择炮塔类型后悬停空地预览攻击范围，点击放置',
          selectedType: null,
          selectedTower: null,
          spawnQueue: [],
          spawnClock: 0,
          enemies: [],
          towers: [],
          projectiles: [],
          occupied: new Map(),
          view: null
        };

        function nearestEnemy(centerX, centerY, range) {
          let nearest = null;
          let nearestDistance = range;

          model.enemies.forEach((enemy) => {
            if (!enemy.alive) {
              return;
            }
            const distance = Math.hypot(enemy.x - centerX, enemy.y - centerY);
            if (distance <= nearestDistance) {
              nearestDistance = distance;
              nearest = enemy;
            }
          });

          return nearest;
        }

        function destroyEntity(entity) {
          entity.destroy();
        }

        function spawnEnemy(kind) {
          const start = PATH.points[0];
          const enemy = Enemy({
            kind,
            startX: start.x,
            startY: start.y,
            waveNumber: model.waveNumber,
            startPathIndex: 1
          });
          model.enemies.push(enemy);
          model.view?.addEntity(enemy);
          return enemy;
        }

        // 开新一波：手动点击或自动倒计时结束都走这里，避免两处重复逻辑。
        function beginWave() {
          if (model.gameOver || model.waveActive) {
            return false;
          }

          model.countdownMs = 0;
          model.waveNumber += 1;
          model.spawnQueue = buildWavePlan(model.waveNumber);
          model.spawnClock = 0;
          model.waveActive = true;
          model.message = `第 ${model.waveNumber} 波来袭`;
          return true;
        }

        return {
          stats() {
            return {
              gold: Math.floor(model.gold),
              lives: model.lives,
              wave: model.waveNumber,
              waveActive: model.waveActive,
              nextIn: Math.ceil(model.countdownMs / 1000),
              gameOver: model.gameOver,
              selectedType: model.selectedType,
              message: model.message
            };
          },

          setView(view) {
            model.view = view;
          },

          selectTowerType(kind) {
            model.selectedType = kind;
            if (model.selectedTower) {
              model.selectedTower.select(false);
              model.selectedTower = null;
            }
            model.message = `已选择${TOWER_DEFS[kind].name}，点击空地放置`;
          },

          // 悬停预览：返回当前选中炮塔在指定格子的射程与可否放置。
          placementInfo({ col, row }) {
            if (!model.selectedType || model.gameOver) {
              return null;
            }

            const def = TOWER_DEFS[model.selectedType];
            const key = `${col},${row}`;
            const center = cellCenter(col, row);
            const blocked =
              PATH.pathCells.has(key) || model.occupied.has(key) || model.gold < def.cost;

            return {
              x: center.x,
              y: center.y,
              range: def.range,
              color: def.color,
              kind: model.selectedType,
              valid: !blocked
            };
          },

          pickTower(tower) {
            const alreadySelected = model.selectedTower === tower;
            if (model.selectedTower) {
              model.selectedTower.select(false);
            }
            model.selectedTower = alreadySelected ? null : tower;
            tower.select(!alreadySelected);
          },

          tryPlaceTower({ col, row }) {
            const key = `${col},${row}`;
            if (model.gameOver || !model.selectedType) {
              model.message = '先在右侧选择一种炮塔';
              return;
            }
            if (PATH.pathCells.has(key)) {
              model.message = '道路格不能放置炮塔';
              return;
            }
            if (model.occupied.has(key)) {
              model.message = '这里已经有炮塔了';
              return;
            }

            const def = TOWER_DEFS[model.selectedType];
            if (model.gold < def.cost) {
              model.message = '金币不足';
              return;
            }

            model.gold -= def.cost;
            model.occupied.set(key, true);
            const tower = Tower({
              col,
              row,
              kind: model.selectedType,
              onPick: (towerApi) => this.pickTower(towerApi)
            });
            model.towers.push(tower);
            model.view?.addEntity(tower);
            model.message = `${def.name}已放置（花费 ${def.cost}）`;
            // 放置成功后自动选中新炮塔，立即显示它的攻击范围。
            this.pickTower(tower);
          },

          startWave() {
            return beginWave();
          },

          update(dtMs, now) {
            if (model.gameOver) {
              return;
            }

            model.spawnClock += dtMs;
            while (model.spawnQueue.length > 0 && model.spawnClock >= model.spawnQueue[0].at) {
              const entry = model.spawnQueue.shift();
              spawnEnemy(entry.kind);
            }

            const arrived = [];
            model.enemies.forEach((enemy) => {
              const result = enemy.step(dtMs / 1000, now);
              if (result.arrived) {
                arrived.push(enemy);
              }
            });

            arrived.forEach((enemy) => {
              model.lives = Math.max(0, model.lives - 1);
              model.enemies.splice(model.enemies.indexOf(enemy), 1);
              destroyEntity(enemy);
              if (model.lives === 0) {
                model.gameOver = true;
                model.message = '基地被攻破，游戏结束';
              }
            });

            model.towers.forEach((tower) => {
              const def = TOWER_DEFS[tower.kind];
              const center = cellCenter(tower.col, tower.row);
              const ready = tower.tick(dtMs);
              if (!ready || model.gameOver) {
                return;
              }

              const target = nearestEnemy(center.x, center.y, def.range);
              if (!target) {
                return;
              }

              const angle = (Math.atan2(target.y - center.y, target.x - center.x) * 180) / Math.PI;
              tower.fire(angle);

              const projectile = Projectile({
                startX: center.x,
                startY: center.y,
                target,
                kind: def.bullet,
                speed: def.projectileSpeed,
                damage: def.damage,
                onHit: () => {
                  const targetKind = target.kind;
                  const dead = target.hit(def.damage, now, def.slowMs ?? 0, def.slowFactor ?? 1);
                  if (dead) {
                    model.gold += ENEMY_DEFS[targetKind].reward;
                    model.enemies.splice(model.enemies.indexOf(target), 1);
                    destroyEntity(target);
                  }
                }
              });
              projectile.target = target;
              model.projectiles.push(projectile);
              model.view?.addEntity(projectile);
            });

            const finishedProjectiles = [];
            model.projectiles.forEach((projectile) => {
              const target = projectile.target;

              // 目标已消失（被击杀或抵达终点）时，弹道必须一并清理，否则会停在场上。
              if (
                !projectile.alive ||
                !target ||
                !target.alive ||
                !model.enemies.includes(target)
              ) {
                finishedProjectiles.push(projectile);
                return;
              }

              const result = projectile.step(
                dtMs / 1000,
                target.x,
                target.y,
                ENEMY_DEFS[target.kind].radius
              );
              if (result.done || !target.alive) {
                finishedProjectiles.push(projectile);
              }
            });

            finishedProjectiles.forEach((projectile) => {
              model.projectiles.splice(model.projectiles.indexOf(projectile), 1);
              destroyEntity(projectile);
            });

            if (model.waveActive && model.spawnQueue.length === 0 && model.enemies.length === 0) {
              model.waveActive = false;
              // 波次清空后进入 10 秒倒计时，倒计时结束自动开始下一波。
              model.countdownMs = 10000;
              model.message = `第 ${model.waveNumber} 波已清除，10 秒后自动开始下一波`;
            } else if (!model.waveActive && !model.gameOver && model.countdownMs > 0) {
              model.countdownMs = Math.max(0, model.countdownMs - dtMs);
              if (model.countdownMs === 0) {
                beginWave();
              }
            }
          }
        };
      }

      function TowerDefenseApp() {
        const model = GameModel();
        let hud = null;
        let playfield = null;
        let frameId = null;
        let lastTime = 0;

        function syncHud() {
          hud.update(model.stats());
        }

        hud = Hud({
          onChooseTower: (kind) => {
            model.selectTowerType(kind);
            syncHud();
          },
          onStartWave: () => {
            model.startWave();
            syncHud();
          }
        });

        playfield = Playfield({
          onCellClick: (cell) => {
            model.tryPlaceTower(cell);
            syncHud();
          },
          resolvePreview: (cell) => model.placementInfo(cell)
        });

        model.setView({
          addEntity: (component) => playfield.addEntity(component)
        });

        function tick(now) {
          const dt = lastTime === 0 ? 16 : Math.min(50, now - lastTime);
          lastTime = now;
          model.update(dt, now);
          syncHud();
          frameId = requestAnimationFrame(tick);
        }

        return {
          render() {
            return div((page) => {
              page.div((card) => {
                card.className('game-card');

                card.div((head) => {
                  head.className('game-head');
                  head.h1('SVG 塔防');
                  head.p('点击炮塔类型 → 点击空地放置；守住基地，抵御一波波敌人。');
                });

                card.div((layout) => {
                  layout.className('game-layout');
                  layout.child(playfield.render());
                  layout.child(hud);
                });
              });
            });
          },

          start() {
            frameId = requestAnimationFrame(tick);
          },

          destroy() {
            cancelAnimationFrame(frameId);
          }
        };
      }

      const demo = TowerDefenseApp();
      const root = demo.render();
      root.bindTo('#app');
      demo.start();
    </script>
  </body>
</html>
