<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yoya-ui SVG 打砖块</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@yoyaflow/yoya-ui@0.5.1/dist/yoya.ui.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #0b1220;
        color: #e2e8f0;
        display: flex;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overscroll-behavior: none;
        padding: 24px;
      }

      .demo-card {
        background: #111a2c;
        border: 1px solid #24324d;
        border-radius: 16px;
        box-shadow: 0 20px 50px rgb(0 0 0 / 45%);
        max-width: 960px;
        padding: 20px 20px 24px;
        width: 100%;
      }

      #app {
        max-width: 960px;
        width: 100%;
      }

      .demo-card h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }

      .demo-card > p {
        color: #8fa3bf;
        font-size: 14px;
        margin: 0 0 16px;
      }

      .hud {
        display: flex;
        flex-wrap: wrap;
        font-size: 13px;
        gap: 20px;
      }

      .hud-bar {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .hud-item {
        color: #8fa3bf;
        display: flex;
        gap: 6px;
      }

      .hud-value {
        color: #facc15;
        font-weight: 600;
      }

      .controls {
        display: flex;
        gap: 8px;
      }

      .control {
        background: #1c2942;
        border: 1px solid #2f4368;
        border-radius: 8px;
        color: #cbd5e1;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        padding: 6px 14px;
        touch-action: manipulation;
      }

      .control:hover {
        background: #243456;
        color: #f8fafc;
      }

      .control:active {
        transform: translateY(1px);
      }

      .pad {
        display: none;
        gap: 12px;
        margin-top: 12px;
      }

      .pad-key {
        align-items: center;
        -webkit-tap-highlight-color: transparent;
        background: #1c2942;
        border: 1px solid #2f4368;
        border-radius: 12px;
        color: #e2e8f0;
        display: flex;
        flex: 1;
        font-family: inherit;
        font-size: 22px;
        justify-content: center;
        min-height: 56px;
        touch-action: none;
        user-select: none;
      }

      .pad-key[data-held='true'] {
        background: #2b3d5f;
        color: #facc15;
      }

      /* 手机 / 平板（无悬停的粗指针）以及窄窗口：显示底部左右手柄 */
      @media (hover: none), (pointer: coarse), (max-width: 640px) {
        .pad {
          display: flex;
        }
      }

      .playfield {
        background: #16213a;
        border: 1px solid #2b3d5f;
        border-radius: 12px;
        display: block;
        height: auto;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        user-select: none;
        width: 100%;
      }

      @media (max-width: 640px) {
        body {
          align-items: flex-start;
          padding: 12px;
        }

        .demo-card {
          border-radius: 12px;
          padding: 16px 14px 18px;
        }

        .demo-card h1 {
          font-size: 17px;
        }

        .demo-card > p {
          font-size: 13px;
        }

        .hud {
          font-size: 12px;
          gap: 14px;
        }

        .controls {
          width: 100%;
        }

        .control {
          flex: 1;
          padding: 9px 10px;
        }
      }

      .wall-guide {
        fill: none;
        stroke: #223252;
        stroke-width: 1;
      }

      .brick {
        stroke: #0b1220;
        stroke-width: 1.5;
      }

      .brick--row-0 {
        fill: #f472b6;
      }

      .brick--row-1 {
        fill: #fb923c;
      }

      .brick--row-2 {
        fill: #facc15;
      }

      .brick--row-3 {
        fill: #4ade80;
      }

      .brick--row-4 {
        fill: #38bdf8;
      }

      .paddle {
        fill: #e2e8f0;
      }

      .ball {
        fill: #facc15;
        stroke: #fde68a;
        stroke-width: 2;
      }

      .overlay {
        transition: opacity 160ms ease;
      }

      .overlay-panel {
        fill: #0b1220;
        fill-opacity: 0.88;
        stroke: #2b3d5f;
        stroke-width: 1.5;
      }

      .overlay-title {
        fill: #f8fafc;
        font-size: 34px;
        font-weight: 600;
        text-anchor: middle;
      }

      .overlay-hint {
        fill: #93a5c0;
        font-size: 16px;
        text-anchor: middle;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      import {
        bindWindowEvent,
        computed,
        div,
        ref,
        svg,
        svgs,
        vText
      } from 'https://cdn.jsdelivr.net/npm/@yoyaflow/yoya-ui@0.5.1/dist/yoya.ui.full.min.js';

      /*
       * 分层与项目 features 模块同构，单文件演示把三层放在一起：
       * - BreakoutPageState：状态与动作（真实项目放 features/breakout/api/breakout.state.js，默认导出）
       * - KeyboardInput / Paddle / Ball / BrickWall / Hud / Overlay：视图组件
       * - Playfield / BreakoutPage：页面组合与主循环
       */

      const VIEW = { width: 900, height: 600 };
      const PLAY = { left: 24, right: 876, top: 24 };
      const PADDLE = { width: 132, height: 16, y: 546, speed: 12 };
      const BALL = { radius: 9, baseSpeed: 3.1, maxSpeed: 8, startY: 496 };
      const WALL = {
        cols: 10,
        rows: 5,
        width: 76,
        height: 22,
        gapX: 8,
        gapY: 10,
        left: 42,
        top: 70
      };
      const BRICK_SCORE = [50, 40, 30, 20, 10];
      const LEVEL_SPEED_STEP = 0.8; // 每过一关的保底提速
      const BRICK_SPEED_STEP = 0.06; // 每打掉一块砖的提速，分数越高球越快
      const START_LIVES = 3;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      /**
       * 页面状态：持有数据与动作，动作只写状态，不碰 DOM。
       * 要驱动视图的字段用 ref 持有，视图直接绑句柄，写入即更新。
       */
      class BreakoutPageState {
        constructor() {
          this.score = ref(0);
          this.best = ref(0);
          this.lives = ref(START_LIVES);
          this.level = ref(1);
          this.phase = ref('running'); // running | paused | cleared | over
          this.bricks = ref(BreakoutPageState.createBricks());
          this.paddleX = ref(VIEW.width / 2);
          this.ballX = ref(VIEW.width / 2);
          this.ballY = ref(BALL.startY);
          this.ballVX = ref(0);
          this.ballVY = ref(0);
          this.serve();
        }

        /** 砖块布局是纯数据，放在状态类里，换关卡时复用同一份。 */
        static createBricks() {
          const bricks = [];

          for (let row = 0; row < WALL.rows; row += 1) {
            for (let col = 0; col < WALL.cols; col += 1) {
              bricks.push({
                row,
                col,
                x: WALL.left + col * (WALL.width + WALL.gapX),
                y: WALL.top + row * (WALL.height + WALL.gapY)
              });
            }
          }

          return bricks;
        }

        get ballSpeed() {
          const cleared = WALL.cols * WALL.rows - this.bricks.value.length;
          const speed =
            BALL.baseSpeed + (this.level.value - 1) * LEVEL_SPEED_STEP + cleared * BRICK_SPEED_STEP;

          return Math.min(speed, BALL.maxSpeed);
        }

        /** 每帧推进一帧固定步长：球拍跟手、球位移与反弹、碰砖、落底。 */
        advance(input) {
          if (this.phase.value !== 'running') {
            return;
          }

          const axis = input.axis();
          if (axis !== 0) {
            this.movePaddle(this.paddleX.value + axis * PADDLE.speed);
          }

          const previousY = this.ballY.value;
          let x = this.ballX.value + this.ballVX.value;
          let y = this.ballY.value + this.ballVY.value;
          let vx = this.ballVX.value;
          let vy = this.ballVY.value;

          if (x - BALL.radius <= PLAY.left) {
            x = PLAY.left + BALL.radius;
            vx = Math.abs(vx);
          }
          if (x + BALL.radius >= PLAY.right) {
            x = PLAY.right - BALL.radius;
            vx = -Math.abs(vx);
          }
          if (y - BALL.radius <= PLAY.top) {
            y = PLAY.top + BALL.radius;
            vy = Math.abs(vy);
          }

          const paddleReach = PADDLE.width / 2 + BALL.radius;
          const reachedPaddle =
            vy > 0 && y + BALL.radius >= PADDLE.y && y <= PADDLE.y + PADDLE.height;
          if (reachedPaddle && Math.abs(x - this.paddleX.value) <= paddleReach) {
            // 击球点决定回球角度：越靠边，水平速度越大
            const offset = clamp((x - this.paddleX.value) / (PADDLE.width / 2), -1, 1);
            vx = offset * 5.4;
            vy = -Math.abs(vy);
            y = PADDLE.y - BALL.radius;
          }

          const hit = this._findHit(x, y, previousY);
          if (hit) {
            if (hit.axis === 'y') {
              vy = -vy;
            } else {
              vx = -vx;
            }
            this._breakBrick(hit.brick);
          }

          if (y - BALL.radius > VIEW.height) {
            this._loseBall();
            return;
          }

          // 速率随进度增长，方向仍由反弹决定：这里只把当前速度向量归一化到目标速率
          const speed = this.ballSpeed;
          const magnitude = Math.hypot(vx, vy) || speed;
          vx = (vx / magnitude) * speed;
          vy = (vy / magnitude) * speed;

          this.ballX.value = x;
          this.ballY.value = y;
          this.ballVX.value = vx;
          this.ballVY.value = vy;
        }

        movePaddle(x) {
          const half = PADDLE.width / 2;
          this.paddleX.value = clamp(x, PLAY.left + half, PLAY.right - half);
        }

        togglePause() {
          if (this.phase.value === 'running') {
            this.phase.value = 'paused';
          } else if (this.phase.value === 'paused') {
            this.phase.value = 'running';
          }
        }

        /** 遮罩上的一次点击 / 回车：按当前阶段决定继续、下一关还是重开。 */
        primaryAction() {
          if (this.phase.value === 'cleared') {
            this.nextLevel();
          } else if (this.phase.value === 'over') {
            this.restart();
          } else if (this.phase.value === 'paused') {
            this.togglePause();
          }
        }

        restart() {
          this.score.value = 0;
          this.lives.value = START_LIVES;
          this.level.value = 1;
          this.bricks.value = BreakoutPageState.createBricks();
          this.paddleX.value = VIEW.width / 2;
          this.serve();
          this.phase.value = 'running';
        }

        nextLevel() {
          this.level.value += 1;
          this.bricks.value = BreakoutPageState.createBricks();
          this.serve();
          this.phase.value = 'running';
        }

        serve() {
          const speed = this.ballSpeed;

          this.ballX.value = this.paddleX.value;
          this.ballY.value = BALL.startY;
          this.ballVX.value = speed * 0.5;
          this.ballVY.value = -speed * 0.87;
        }

        _findHit(x, y, previousY) {
          for (const brick of this.bricks.value) {
            const overlapX = x + BALL.radius > brick.x && x - BALL.radius < brick.x + WALL.width;
            const overlapY = y + BALL.radius > brick.y && y - BALL.radius < brick.y + WALL.height;
            if (!overlapX || !overlapY) {
              continue;
            }

            const fromTopOrBottom =
              previousY + BALL.radius <= brick.y ||
              previousY - BALL.radius >= brick.y + WALL.height;

            return { brick, axis: fromTopOrBottom ? 'y' : 'x' };
          }

          return null;
        }

        _breakBrick(brick) {
          this.score.value += BRICK_SCORE[brick.row] ?? 10;
          this._syncBest();
          // 换一份新数组：区域读到的是信号，写入后按新数据重建这一片砖块
          this.bricks.value = this.bricks.value.filter((item) => item !== brick);
          if (this.bricks.value.length === 0) {
            this.phase.value = 'cleared';
          }
        }

        _loseBall() {
          this.lives.value -= 1;
          this._syncBest();
          if (this.lives.value <= 0) {
            this.phase.value = 'over';
            return;
          }
          this.serve();
        }

        _syncBest() {
          this.best.value = Math.max(this.best.value, this.score.value);
        }
      }

      /* ── 视图组件 ───────────────────────────────────────────────────── */

      /**
       * 球拍输入：键盘（方向键 / WASD）与触屏手柄（◀ ▶）合并成同一个方向轴，
       * 另把空格、回车这类动作键转给页面。按住不放即持续移动，松手即停。
       */
      function PaddleInput({ onPress }) {
        const keyboardHeld = new Set();
        const padHeld = new Set();
        const moveKeys = { ArrowLeft: 'left', ArrowRight: 'right', a: 'left', d: 'right' };

        function normalize(event) {
          return event.key.length === 1 ? event.key.toLowerCase() : event.key;
        }

        function handleKeyDown(event) {
          const key = normalize(event);
          const move = moveKeys[key];

          if (move) {
            event.preventDefault();
            keyboardHeld.add(move);
            return;
          }

          if (key === ' ' || key === 'Enter') {
            // 焦点落在按钮上时交给原生点击，避免同一次按键被处理两次
            if (event.target instanceof Element && event.target.closest('button')) {
              return;
            }

            event.preventDefault();
            onPress(key);
          }
        }

        function handleKeyUp(event) {
          const move = moveKeys[normalize(event)];
          if (move) {
            keyboardHeld.delete(move);
          }
        }

        function clear() {
          keyboardHeld.clear();
          padHeld.clear();
        }

        return {
          bind() {
            const unbinds = [
              bindWindowEvent('keydown', handleKeyDown),
              bindWindowEvent('keyup', handleKeyUp),
              bindWindowEvent('blur', clear)
            ];

            return () => unbinds.forEach((unbind) => unbind());
          },

          axis() {
            const left = keyboardHeld.has('left') || padHeld.has('left');
            const right = keyboardHeld.has('right') || padHeld.has('right');

            return (right ? 1 : 0) - (left ? 1 : 0);
          },

          hold(direction) {
            padHeld.add(direction);
          },

          release(direction) {
            padHeld.delete(direction);
          },

          clear
        };
      }

      /** 底部手柄：按住 ◀ / ▶ 持续移动球拍，松手或移出按键即停。 */
      function PaddlePad(input) {
        function key(direction, glyph, label) {
          return div((cell) => {
            cell.button((button) => {
              function start(event) {
                event.preventDefault();
                button.attr('data-held', 'true');
                input.hold(direction);
              }

              function stop() {
                button.attr('data-held', null);
                input.release(direction);
              }

              button.className(`pad-key pad-key--${direction}`);
              button.attr({ type: 'button', 'aria-label': label });
              button.text(glyph);
              button.on('pointerdown', start);
              button.on('pointerup', stop);
              button.on('pointercancel', stop);
              button.on('pointerleave', stop);
            });
          });
        }

        return {
          render() {
            return div((pad) => {
              pad.className('pad');
              pad.child(key('left', '◀', '球拍向左'));
              pad.child(key('right', '▶', '球拍向右'));
            });
          }
        };
      }

      function Paddle(paddleX) {
        const transform = computed(() => `translate(${paddleX.value} ${PADDLE.y})`);

        return {
          render() {
            // 组件返回的是游离节点：用 svgs.rect 建，不必 new SvgElementNode
            return svgs.rect((bar) => {
              bar.className('paddle');
              bar.attr({
                x: -PADDLE.width / 2,
                y: 0,
                width: PADDLE.width,
                height: PADDLE.height,
                rx: 8,
                transform
              });
            });
          }
        };
      }

      function Ball(state) {
        const transform = computed(() => `translate(${state.ballX.value} ${state.ballY.value})`);

        return {
          render() {
            return svgs.circle((ball) => {
              ball.className('ball');
              ball.attr({ cx: 0, cy: 0, r: BALL.radius, transform });
            });
          }
        };
      }

      function BrickWall(bricks) {
        return {
          render() {
            return svgs.g((wall) => {
              wall.className('brick-wall');
              // 约定：先 rebuildable()，再读数据，区域内读到的信号才计入依赖
              wall.rebuildable();

              bricks.value.forEach((brick) => {
                // 游离节点先建好，再挂进区域；区域重跑时整片按新数据重建
                wall.child(
                  svgs.rect({
                    class: `brick brick--row-${brick.row}`,
                    x: brick.x,
                    y: brick.y,
                    width: WALL.width,
                    height: WALL.height,
                    rx: 5,
                    'data-brick': `${brick.row}-${brick.col}`
                  })
                );
              });
            });
          }
        };
      }

      function Hud(state) {
        const scoreText = computed(() => String(state.score.value));
        const bestText = computed(() => String(state.best.value));
        const livesText = computed(() => '❤'.repeat(Math.max(state.lives.value, 0)) || '—');
        const levelText = computed(() => `第 ${state.level.value} 关`);
        const speedText = computed(() => state.ballSpeed.toFixed(1));

        function item(key, label, value) {
          return div((entry) => {
            entry.className(`hud-item hud-item--${key}`);
            entry.span((name) => name.className('hud-label').text(label));
            entry.strong((number) => {
              number.className('hud-value');
              number.child(vText(value));
            });
          });
        }

        return {
          render() {
            return div((hud) => {
              hud.className('hud');
              hud.child(item('score', '分数', scoreText));
              hud.child(item('best', '最高分', bestText));
              hud.child(item('lives', '生命', livesText));
              hud.child(item('level', '进度', levelText));
              hud.child(item('speed', '球速', speedText));
            });
          }
        };
      }

      function Controls(state) {
        const pauseLabel = computed(() => (state.phase.value === 'paused' ? '继续' : '暂停'));

        function control(key, label, onClick) {
          return div((cell) => {
            cell.button((button) => {
              button.className(`control control--${key}`);
              button.attr('type', 'button');
              button.on('click', onClick);
              button.text(label);
            });
          });
        }

        return {
          render() {
            return div((bar) => {
              bar.className('controls');
              bar.child(control('pause', pauseLabel, () => state.togglePause()));
              bar.child(control('restart', '重新开始', () => state.restart()));
            });
          }
        };
      }

      function Overlay(state) {
        const visible = computed(() => state.phase.value !== 'running');
        const opacity = computed(() => (visible.value ? '1' : '0'));
        const pointerEvents = computed(() => (visible.value ? 'auto' : 'none'));
        const title = computed(() => {
          if (state.phase.value === 'paused') {
            return '已暂停';
          }
          if (state.phase.value === 'cleared') {
            return `第 ${state.level.value} 关通过`;
          }
          if (state.phase.value === 'over') {
            return '游戏结束';
          }
          return '';
        });
        const hint = computed(() => {
          if (state.phase.value === 'paused') {
            return '空格继续';
          }
          if (state.phase.value === 'cleared') {
            return `回车进入第 ${state.level.value + 1} 关`;
          }
          if (state.phase.value === 'over') {
            return `最高分 ${state.best.value} · 回车重开`;
          }
          return '';
        });

        return {
          render() {
            return svgs.g((layer) => {
              layer.className('overlay');
              layer.style({ opacity, 'pointer-events': pointerEvents });
              layer.on('click', () => state.primaryAction());

              layer.rect({
                class: 'overlay-panel',
                x: PLAY.left,
                y: 180,
                width: PLAY.right - PLAY.left,
                height: 240,
                rx: 16
              });
              layer.text((line) => {
                line.className('overlay-title');
                line.attr({ x: VIEW.width / 2, y: 292 });
                line.child(vText(title));
              });
              layer.text((line) => {
                line.className('overlay-hint');
                line.attr({ x: VIEW.width / 2, y: 336 });
                line.child(vText(hint));
              });
            });
          }
        };
      }

      function Playfield({ wall, paddle, ball, overlay, onPointer }) {
        return {
          render() {
            return svg((field) => {
              field.className('playfield');
              field.attr({
                viewBox: `0 0 ${VIEW.width} ${VIEW.height}`,
                role: 'img',
                'aria-label': '用左右方向键或拖动球拍打砖块'
              });
              // 触屏与鼠标共用一套：按下即就位，拖动跟手（.playfield 关掉了 touch-action）
              field.on('pointerdown', onPointer);
              field.on('pointermove', onPointer);

              field.rect({
                class: 'wall-guide',
                x: PLAY.left,
                y: PLAY.top,
                width: PLAY.right - PLAY.left,
                height: VIEW.height - PLAY.top - 12,
                rx: 10
              });

              field.child(wall);
              field.child(paddle);
              field.child(ball);
              field.child(overlay);
            });
          }
        };
      }

      function BreakoutPage() {
        const state = new BreakoutPageState();
        const input = PaddleInput({
          onPress: (key) => {
            if (key === ' ') {
              state.togglePause();
            } else {
              state.primaryAction();
            }
          }
        });

        const field = Playfield({
          wall: BrickWall(state.bricks),
          paddle: Paddle(state.paddleX),
          ball: Ball(state),
          overlay: Overlay(state),
          onPointer: (event) => {
            const box = event.currentTarget.getBoundingClientRect();
            if (!box.width) {
              return;
            }
            state.movePaddle(((event.clientX - box.left) / box.width) * VIEW.width);
          }
        });

        let frameId = null;
        let unbindInput = null;
        let host = null;

        function tick() {
          // 页面被卸载后停帧：脱离文档的演示不该在后台继续空转
          if (host && !host.isConnected) {
            frameId = null;
            return;
          }

          state.advance(input);
          frameId = requestAnimationFrame(tick);
        }

        return {
          render() {
            return div((page) => {
              page.div((card) => {
                card.className('demo-card');
                card.h1('SVG 打砖块：← → 控制球拍');
                card.p(
                  '键盘用方向键 / WASD，手机用底部 ◀ ▶ 手柄（也可以直接拖动球拍）；空格或按钮暂停，回车重开。球速随分数越来越快。'
                );
                card.div((bar) => {
                  bar.className('hud-bar');
                  bar.child(Hud(state));
                  bar.child(Controls(state));
                });
                card.child(field);
                card.child(PaddlePad(input));
              });
            });
          },

          start(rootNode) {
            host = rootNode.renderDom();
            unbindInput = input.bind();
            frameId = requestAnimationFrame(tick);
          },

          destroy() {
            cancelAnimationFrame(frameId);
            unbindInput?.();
            input.clear();
            host = null;
          }
        };
      }

      const demo = BreakoutPage();
      const root = demo.render();
      root.bindTo('#app');
      demo.start(root);
    </script>
  </body>
</html>
